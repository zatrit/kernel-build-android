name: Build Android kernel
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      BUILD_SRC: ${{ github.workspace }}/build/
      KERNEL_SRC: ${{ github.workspace }}/kernel/
      CCACHE_DIR: /tmp/ccache/
    steps:
      # Setup build scripts
      - run: sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev ccache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -U tuxmake
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: ${{ env.BUILD_SRC }}
      - name: Setup environment variables
        run: cat ${{ env.BUILD_SRC }}/builder.cfg >> $GITHUB_ENV
      # Restore or setup toolchain
      - name: Restore toolchain
        id: restore-toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_SRC }}/toolchain
          key: toolchain-${{ env.CLANG_PREBUILT }}
      - name: Setup toolchain
        if: steps.restore-toolchain.outputs.cache-hit != 'true'
        id: setup-toolchain
        run: |
          cd ${{ env.BUILD_SRC }}
          ./setup-toolchain.sh
      - name: Save toolchain
        if: steps.setup-toolchain.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_SRC }}/toolchain
          key: toolchain-${{ env.CLANG_PREBUILT }}
      # Restore build cache
      - run: mkdir -p ${{ env.CCACHE_DIR }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-
      # Fetch kernel sources and build them
      - name: Checkout kernel sources
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_SRC }}
          repository: zatrit/android_kernel_sdm845_mainline
      - name: Build kernel
        run: |
          cd ${{ env.BUILD_SRC }}
          ./build.sh sdm845_defconfig ${{ env.KERNEL_SRC }} --wrapper ccache
          rm -rf ${{ env.BUILD_SRC }}/modules/lib/modules/*/build
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-sdm845-mainline
          path: ${{ env.BUILD_SRC }}/out/*
